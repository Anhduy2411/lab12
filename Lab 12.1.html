<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel Page</title>
    <!-- Bootstrap 5 CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="bg-primary text-white text-center p-3">
      <h1>Welcome to My Carousel Page</h1>
    </header>

    <!-- Carousel -->
    <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
      <!-- Indicators -->
      <div class="carousel-indicators">
        <button
          type="button"
          data-bs-target="#myCarousel"
          data-bs-slide-to="0"
          class="active"
        ></button>
        <button
          type="button"
          data-bs-target="#myCarousel"
          data-bs-slide-to="1"
        ></button>
        <button
          type="button"
          data-bs-target="#myCarousel"
          data-bs-slide-to="2"
        ></button>
      </div>

      <!-- Inner content -->
      <div class="carousel-inner">
        <div class="carousel-item active bg-img1">
          <div class="carousel-caption">
            <h3>Slide 1</h3>
            <p>This is the first slide</p>
            <a class="btn btn-light" href="#">Learn More</a>
          </div>
        </div>
        <div class="carousel-item bg-img2">
          <div class="carousel-caption">
            <h3>Slide 2</h3>
            <p>This is the second slide</p>
            <a class="btn btn-light" href="#">Discover</a>
          </div>
        </div>
        <div class="carousel-item bg-img3">
          <div class="carousel-caption">
            <h3>Slide 3</h3>
            <p>This is the third slide</p>
            <a class="btn btn-light" href="#">Explore</a>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#myCarousel"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#myCarousel"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <!-- Optional content below carousel -->
    <section class="container mt-5">
      <h2>About This Site</h2>
      <p>
        This is a sample website using Bootstrap Carousel component for learning
        purposes.
      </p>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
